enable: true

title: "Built for memory, not noise"

text: "Mnemo is designed around a simple loop: capture quickly, preserve structure, and resurface with intent. The mobile app is offline-first; cloud features are optional and privacy-aware."

items:
  - pretitle: "Capture"
    pretext: "Moments & media"
    color: "#2BA7A1"
    icon: "pen-line"
    image: "images/blowfish/heroes/fireflies.svg"
    title: "Rich entries that stay readable"
    text: "Write in a calm editor, attach photos, video, audio, and documents, and keep everything tied to dates and context."

  - pretitle: "Structure"
    pretext: "Folders & templates"
    color: "#6E52B5"
    icon: "layers-3"
    image: "images/blowfish/heroes/ripples.svg"
    title: "A place for everything you care about"
    text: "Organize with folders, templates, and habits that match how you actually think—not a rigid database."

  - pretitle: "Recall"
    pretext: "Search & time"
    color: "#2BA7A1"
    icon: "calendar"
    image: "images/blowfish/heroes/waves.svg"
    title: "Find the right fragment at the right time"
    text: "Search across your archive, browse by calendar and map, and use reminders to return to what matters."
