enable: true

title: "Pensato per la memoria, non per il rumore"

text: "Mnemo ruota attorno a un ciclo semplice: cattura veloce, struttura che dura, richiamo intenzionale. L’app mobile è offline-first; il cloud è opzionale e attento alla privacy."

items:
  - pretitle: "Cattura"
    pretext: "Momenti e media"
    color: "#2BA7A1"
    icon: "pen-line"
    image: "images/blowfish/heroes/fireflies.svg"
    title: "Voci ricche che restano leggibili"
    text: "Scrivi in un editor calmo, allega foto, video, audio e documenti, e tieni tutto legato a date e contesto."

  - pretitle: "Struttura"
    pretext: "Cartelle e modelli"
    color: "#6E52B5"
    icon: "layers-3"
    image: "images/blowfish/heroes/ripples.svg"
    title: "Un posto per ciò che ti sta a cuore"
    text: "Organizza con cartelle, modelli e abitudini allineate a come pensi davvero—non a un database rigido."

  - pretitle: "Richiamo"
    pretext: "Ricerca e tempo"
    color: "#2BA7A1"
    icon: "calendar"
    image: "images/blowfish/heroes/waves.svg"
    title: "Il frammento giusto al momento giusto"
    text: "Cerca nell’archivio, sfoglia calendario e mappa, usa i promemoria per tornare a ciò che conta."
